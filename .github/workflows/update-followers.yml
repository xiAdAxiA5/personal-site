name: Update Follower Counts

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fetch-followers.mjs'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch follower counts
        run: node scripts/fetch-followers.mjs

      - name: Commit and push if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/followers.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update follower counts [skip ci]"
            git push
          fi
